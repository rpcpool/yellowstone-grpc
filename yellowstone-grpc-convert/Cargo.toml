[package]
name = "yellowstone-grpc-convert"
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
description = "Yellowstone gRPC conversions between Geyser Protobuf and Solana types"
homepage = { workspace = true }
repository = { workspace = true }
license = "Apache-2.0"
keywords = { workspace = true }
publish = { workspace = true }

[dependencies]
solana-account = { workspace = true }
solana-account-decoder = { workspace = true }
solana-clock = { workspace = true }
solana-hash = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-transaction-context = { workspace = true }
solana-transaction-error = { workspace = true, features = ["wincode"] }
solana-transaction-status = { workspace = true, features = ["agave-unstable-api"] }
wincode = { workspace = true }
yellowstone-grpc-proto = { workspace = true }

[lints]
workspace = true
