# The lock audit: data-path modules deny these lints. Every other module allows them at the
# crate root.

disallowed-types = [
    { path = "std::sync::Mutex", reason = "no locks on the data path" },
    { path = "std::sync::RwLock", reason = "no locks on the data path" },
    { path = "std::sync::Condvar", reason = "no locks on the data path" },
    { path = "std::sync::OnceLock", reason = "no locks on the data path; use a claim cell" },
    { path = "parking_lot::Mutex", reason = "no locks on the data path" },
    { path = "parking_lot::RwLock", reason = "no locks on the data path" },
    { path = "parking_lot::Condvar", reason = "no locks on the data path" },
    { path = "tokio::sync::Mutex", reason = "no locks on the data path" },
    { path = "tokio::sync::RwLock", reason = "no locks on the data path" },
    { path = "tokio::sync::Semaphore", reason = "no locks on the data path" },
    { path = "tokio::sync::OnceCell", reason = "no locks on the data path; use a claim cell" },
    { path = "tokio::sync::mpsc::Sender", reason = "tokio channels lock on the data path" },
    { path = "tokio::sync::mpsc::Receiver", reason = "tokio channels lock on the data path" },
    { path = "tokio::sync::mpsc::UnboundedSender", reason = "tokio channels lock on the data path" },
    { path = "tokio::sync::mpsc::UnboundedReceiver", reason = "tokio channels lock on the data path" },
    { path = "tokio::sync::broadcast::Sender", reason = "tokio channels lock on the data path" },
    { path = "tokio::sync::broadcast::Receiver", reason = "tokio channels lock on the data path" },
    { path = "tokio::fs::File", reason = "no file IO on the data path" },
    { path = "tokio::fs::OpenOptions", reason = "no file IO on the data path" },
]

disallowed-methods = [
    { path = "tokio::sync::mpsc::channel", reason = "tokio channels lock on the data path" },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "tokio channels lock on the data path" },
    { path = "tokio::sync::broadcast::channel", reason = "tokio channels lock on the data path" },
    { path = "tokio::task::spawn_blocking", reason = "no blocking pool on the data path" },
    { path = "tokio::task::block_in_place", reason = "no blocking on the data path" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "no blocking pool on the data path" },
    { path = "tokio::fs::read", reason = "no file IO on the data path" },
    { path = "tokio::fs::read_to_string", reason = "no file IO on the data path" },
    { path = "tokio::fs::write", reason = "no file IO on the data path" },
    { path = "tokio::fs::metadata", reason = "no file IO on the data path" },
    { path = "tokio::fs::read_dir", reason = "no file IO on the data path" },
    { path = "tokio::fs::create_dir_all", reason = "no file IO on the data path" },
    { path = "tokio::fs::remove_file", reason = "no file IO on the data path" },
    { path = "tokio::fs::rename", reason = "no file IO on the data path" },
    { path = "prometheus::core::MetricVec::with_label_values", reason = "a label lookup locks the family" },
    { path = "prometheus::core::MetricVec::get_metric_with_label_values", reason = "a label lookup locks the family" },
    { path = "prometheus::core::MetricVec::with", reason = "a label lookup locks the family" },
    { path = "prometheus::core::MetricVec::get_metric_with", reason = "a label lookup locks the family" },
    # The metrics helpers below each make a label lookup.
    { path = "yellowstone_grpc_geyser::metrics::observe_filter_complexity", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::incr_ip_conncur_rate_limit_exceeded", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::incr_method_ratelimited_count", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::update_invalid_blocks", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::subscription_limit_exceeded_inc", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::update_subscriptions", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::missed_status_message_inc", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::set_subscriber_send_bandwidth_load", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::incr_client_disconnect", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::incr_grpc_method_call_count", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::grpc_service_outbound_bytes_gauge", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::reset_grpc_service_outbound_bytes", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::set_grpc_concurrent_subscribe_per_subscriber_id", reason = "a label lookup locks the family" },
    { path = "yellowstone_grpc_geyser::metrics::remove_grpc_concurrent_subscribe_per_subscriber_id", reason = "a label lookup locks the family" },
    # A stream registers and leaves at its session's start and end, under the registry's lock.
    { path = "yellowstone_grpc_geyser::telemetry::stream_counters::SubscriberCounts::open_stream", reason = "the subscriber registry locks" },
    { path = "yellowstone_grpc_geyser::telemetry::stream_counters::SubscriberCounts::close_stream", reason = "the subscriber registry locks" },
]
