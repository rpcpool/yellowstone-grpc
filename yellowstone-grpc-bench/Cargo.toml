[package]
name = "yellowstone-grpc-bench"
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
publish = false
description = "Latency benchmark harness for the Yellowstone gRPC geyser plugin"

[[bin]]
name = "ygb"
path = "src/main.rs"

[dependencies]
agave-geyser-plugin-interface = { workspace = true }
anyhow = { workspace = true }
bs58 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossbeam-channel = { workspace = true }
env_logger = { workspace = true }
flate2 = "1.1.10"
futures = { workspace = true }
h2 = "0.4.20"
http = { workspace = true }
libc = "0.2.191"
libloading = "0.9.0"
log = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
solana-hash = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-status = { workspace = true }
toml = { workspace = true }
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tonic = { workspace = true, features = ["zstd", "gzip", "tls-native-roots", "tls-ring"] }
yellowstone-grpc-geyser = { workspace = true }
yellowstone-grpc-proto = { workspace = true, features = ["tonic", "tonic-compression", "account-data-as-bytes"] }
zstd = { workspace = true }

[lints]
workspace = true
